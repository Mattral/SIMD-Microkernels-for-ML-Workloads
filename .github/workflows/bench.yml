name: Weekly Benchmark

on:
  schedule:
    - cron: '0 4 * * 0'   # Every Sunday at 4 AM UTC
  workflow_dispatch:        # Also runnable manually

jobs:
  bench:
    name: Statistical Benchmark
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build g++ libopenblas-dev \
            libpybind11-dev python3-dev python3-pip
          pip3 install numpy

      - name: Build (with OpenBLAS for baseline comparison)
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBENCH_OPENBLAS=ON
          cmake --build build --parallel

      - name: Run statistical benchmark
        run: |
          # Note: GH Actions runners are noisy (no freq lock, shared CPU).
          # These numbers are for longitudinal regression detection only,
          # not for absolute performance claims.
          mkdir -p benchmarks/results
          ./build/bench_stat \
            --sizes 64,128,256,512 \
            --reps 30 \
            --output benchmarks/results/ci_gemm_results.json

      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        with:
          name: bench-results-${{ github.sha }}
          path: benchmarks/results/ci_gemm_results.json
          retention-days: 90

      - name: Performance regression check
        # Only run if a committed baseline exists
        run: |
          if [ -f benchmarks/results/gemm_results.json ]; then
            python3 benchmarks/check_regression.py \
              --baseline benchmarks/results/gemm_results.json \
              --current  benchmarks/results/ci_gemm_results.json \
              --max-regression-pct 20
          else
            echo "No committed baseline found; skipping regression check."
            echo "To establish a baseline, run bench_stat on dedicated hardware"
            echo "and commit the output to benchmarks/results/gemm_results.json"
          fi

      - name: Run Python benchmark smoke test
        run: |
          pip3 install scikit-build-core pybind11
          pip3 install -e . --no-build-isolation -q
          python3 tests/test_bench.py --quick --no-plot
