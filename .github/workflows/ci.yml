name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel in-progress runs on the same branch/PR to save CI minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── C++ Build and Test Matrix ───────────────────────────────────────────────
  cpp:
    name: C++ / ${{ matrix.os }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 + GCC-12 (primary)
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
            pkgs: gcc-12 g++-12

          # Ubuntu 22.04 + Clang-15
          - os: ubuntu-22.04
            compiler: clang-15
            cc: clang-15
            cxx: clang++-15
            pkgs: clang-15

          # Ubuntu 24.04 + GCC-13 (newer toolchain)
          - os: ubuntu-24.04
            compiler: gcc-13
            cc: gcc-13
            cxx: g++-13
            pkgs: gcc-13 g++-13

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ${{ matrix.pkgs }} \
            cmake ninja-build \
            python3-dev python3-pip

      - name: Install pybind11 (for Python extension build in tests)
        run: pip3 install "pybind11[global]>=2.11" numpy --break-system-packages 2>/dev/null || \
             pip3 install "pybind11[global]>=2.11" numpy

      - name: Configure
        env:
          CC:  ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}

      - name: Build
        run: cmake --build build --parallel

      - name: C++ tests
        run: ctest --test-dir build --output-on-failure --parallel 4

      - name: Benchmark smoke test (first 60 lines)
        run: ./build/bench --warmup 1 --reps 3 2>&1 | head -60

  # ─── Python Extension + Precision Tests ─────────────────────────────────────
  python:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python-version: "3.10"
          - os: ubuntu-22.04
            python-version: "3.11"
          - os: ubuntu-22.04
            python-version: "3.12"
          - os: ubuntu-24.04
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++-12

      - name: Install Python build and test dependencies
        run: |
          python -m pip install \
            "scikit-build-core>=0.6" \
            "pybind11[global]>=2.11" \
            "numpy>=1.24" \
            "scipy>=1.11" \
            "pytest>=7.4"
          # Install CPU-only PyTorch to enable the 4 cross-validation tests
          # (test_gelu_vs_pytorch_tanh_approx, test_silu_vs_pytorch,
          #  test_softmax_vs_pytorch_2d, test_layer_norm_vs_pytorch)
          # that are currently always skipped without torch.
          # CPU-only index avoids the 2 GB CUDA variant.
          python -m pip install \
            torch --index-url https://download.pytorch.org/whl/cpu \
            --quiet || echo "PyTorch install failed (non-fatal: tests will skip)"

      - name: Build and install Python extension
        run: python -m pip install -e . --no-build-isolation -v

      - name: Smoke test (verify import and basic ops)
        run: |
          python - << 'EOF'
          import simd_kernels, numpy as np
          print(simd_kernels.build_info())
          A = np.random.randn(32, 32).astype(np.float32)
          B = np.random.randn(32, 32).astype(np.float32)
          C = simd_kernels.sgemm(A, B)
          assert C.shape == (32, 32), f"bad shape: {C.shape}"
          x = np.random.randn(1024).astype(np.float32)
          y = simd_kernels.gelu(x)
          assert y.shape == x.shape
          y = simd_kernels.layer_norm(x)
          assert y.shape == x.shape
          print("Smoke test: PASS")
          EOF

      - name: Run precision and binding tests
        run: |
          pytest tests/test_precision.py \
                 tests/test_bindings_edge_cases.py \
                 -v --tb=short

      - name: Python benchmark smoke test
        run: python tests/test_bench.py --no-plot --quick

  # ─── ASan / UBSan (Clang-15, Ubuntu 22.04) ───────────────────────────────────
  sanitizers:
    name: ASan + UBSan / clang-15
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang-15 cmake ninja-build python3-dev python3-pip
          pip3 install "pybind11[global]>=2.11" numpy --break-system-packages 2>/dev/null || \
          pip3 install "pybind11[global]>=2.11" numpy

      - name: Configure (RelWithDebInfo + sanitizers)
        run: |
          cmake -S . -B build_asan -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_COMPILER=clang++-15 \
            -DSIMD_ML_SANITIZE=ON

      - name: Build
        run: cmake --build build_asan --parallel

      - name: Run sanitized tests
        run: |
          ASAN_OPTIONS=detect_leaks=1:abort_on_error=1 \
          UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
          ctest --test-dir build_asan --output-on-failure --parallel 1

  # ─── Final summary gate ───────────────────────────────────────────────────────
  all-pass:
    name: All checks passed
    needs: [cpp, python, sanitizers]
    runs-on: ubuntu-latest
    # Run even if earlier jobs fail so we always get a status update.
    # 'skipped' is treated as success (e.g. matrix jobs skipped due to
    # path filters or manual workflow_dispatch without certain inputs).
    if: always()
    steps:
      - name: Verify all required jobs succeeded
        run: |
          cpp_result="${{ needs.cpp.result }}"
          python_result="${{ needs.python.result }}"
          san_result="${{ needs.sanitizers.result }}"
          echo "cpp:        $cpp_result"
          echo "python:     $python_result"
          echo "sanitizers: $san_result"

          failed=0
          for r in "$cpp_result" "$python_result" "$san_result"; do
            # Accept 'success' or 'skipped'; reject 'failure' or 'cancelled'.
            if [[ "$r" != "success" && "$r" != "skipped" ]]; then
              failed=1
            fi
          done

          if [[ $failed -eq 1 ]]; then
            echo "❌  One or more required CI jobs did not succeed."
            exit 1
          fi
          echo "✅  All required CI jobs passed."
